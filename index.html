<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音乐播放器</title>
  
  <style>
    /* 基础全局样式 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #333;
    }

    /* 播放器卡片主容器 */
    .player-card {
      background: #ffffff;
      width: 360px;
      padding: 30px 24px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 歌曲信息 */
    .song-title {
      font-size: 20px;
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 6px;
      text-align: center;
    }

    .song-artist {
      font-size: 14px;
      color: #718096;
      margin-bottom: 20px;
      text-align: center;
    }

    /* 歌词展示区域 */
    .lyric-box {
      width: 100%;
      height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-size: 15px;
      color: #4a5568;
      margin-bottom: 25px;
      padding: 0 10px;
      line-height: 1.4;
      transition: all 0.3s ease;
    }

    /* 播放控制按钮栏容器 */
    .controls-container {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    /* 通用按钮基础样式 */
    .control-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #a0aec0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      outline: none;
    }

    .control-btn:hover {
      color: #4a6fa5;
    }

    /* 主播放/暂停圆盘按钮 */
    .play-btn {
      width: 56px;
      height: 56px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
      color: #4a6fa5;
    }

    .play-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
      color: #3b5984;
    }

    /* 右侧不起眼的播放列表按钮 */
    .playlist-toggle-btn {
      position: absolute;
      right: 5px;
      color: #cbd5e0; /* 极简低调灰 */
      padding: 8px;
      border-radius: 50%;
    }

    .playlist-toggle-btn:hover {
      color: #4a6fa5;
      background-color: rgba(0, 0, 0, 0.03);
    }

    /* 弹出的播放列表抽屉面板 */
    .playlist-panel {
      position: absolute;
      bottom: 85px;
      right: 0;
      width: 100%;
      max-height: 240px;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      overflow-y: auto;
      display: none; /* 默认隐藏 */
      z-index: 100;
      padding: 8px 0;
      border: 1px solid #edf2f7;
    }

    .playlist-panel.active {
      display: block; /* 点击后展开 */
    }

    .playlist-item {
      padding: 12px 20px;
      font-size: 14px;
      color: #4a5568;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .playlist-item:hover {
      background: #f7fafc;
    }

    /* 当前正在播放的歌曲样式 */
    .playlist-item.playing {
      color: #4a6fa5;
      font-weight: 600;
      background: #ebf8ff;
    }
  </style>
</head>
<body>

  <div class="player-card">
    <!-- 1. 歌曲与歌手名称 -->
    <div class="song-title" id="songTitle">未加载歌曲</div>
    <div class="song-artist" id="songArtist">--</div>

    <!-- 2. 动态歌词展示 -->
    <div class="lyric-box" id="lyricDisplay">播放音乐以同步显示歌词</div>

    <!-- 3. 播放控制区域 -->
    <div class="controls-container">
      <div class="btn-group">
        <!-- 上一首 -->
        <button class="control-btn" id="prevBtn" title="上一首">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
          </svg>
        </button>

        <!-- 播放/暂停 -->
        <button class="control-btn play-btn" id="playBtn" title="播放/暂停">
          <svg id="playIcon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </button>

        <!-- 下一首 -->
        <button class="control-btn" id="nextBtn" title="下一首">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
          </svg>
        </button>
      </div>

      <!-- 不起眼的播放列表菜单图标 -->
      <button class="control-btn playlist-toggle-btn" id="playlistToggleBtn" title="播放列表">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M4 10h12v2H4zm0-4h16v2H4zm0 8h8v2H4zm10 0v6l5-3z"/>
        </svg>
      </button>

      <!-- 播放列表弹出面板 -->
      <div class="playlist-panel" id="playlistPanel">
        <!-- 歌曲列表项会通过 JS 自动注入到这里 -->
      </div>
    </div>
  </div>

  <!-- 原生的音频播放控件（隐式） -->
  <audio id="audioPlayer"></audio>

  <!-- 引入外部 JavaScript 数据脚本 -->
  <script src="./songs.js"></script>
  <script src="./lyrics.js"></script>

  <!-- 主逻辑脚本 -->
  <script>
    let currentIndex = 0;
    let isPlaying = false;

    const audio = document.getElementById('audioPlayer');
    const songTitle = document.getElementById('songTitle');
    const songArtist = document.getElementById('songArtist');
    const lyricDisplay = document.getElementById('lyricDisplay');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const playlistToggleBtn = document.getElementById('playlistToggleBtn');
    const playlistPanel = document.getElementById('playlistPanel');

    // 页面加载完成后初始化
    window.addEventListener('DOMContentLoaded', () => {
      if (typeof songList !== 'undefined' && songList.length > 0) {
        renderPlaylist();
        loadSong(currentIndex);
      } else {
        songTitle.innerText = "未找到歌曲数据";
      }
    });

    // 加载歌曲
    function loadSong(index) {
      const song = songList[index];
      songTitle.innerText = song.title;
      songArtist.innerText = song.artist;
      audio.src = song.src;
      lyricDisplay.innerText = "准备播放";

      updatePlaylistHighlight();
    }

    // 切换播放/暂停
    function togglePlay() {
      if (isPlaying) {
        pauseSong();
      } else {
        playSong();
      }
    }

    function playSong() {
      isPlaying = true;
      audio.play();
      // 切换图标为暂停形状
      playIcon.innerHTML = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`;
    }

    function pauseSong() {
      isPlaying = false;
      audio.pause();
      // 切换图标为播放三角形
      playIcon.innerHTML = `<path d="M8 5v14l11-7z"/>`;
    }

    // 切歌
    prevBtn.addEventListener('click', () => {
      currentIndex = (currentIndex - 1 + songList.length) % songList.length;
      loadSong(currentIndex);
      if (isPlaying) playSong();
    });

    nextBtn.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % songList.length;
      loadSong(currentIndex);
      if (isPlaying) playSong();
    });

    playBtn.addEventListener('click', togglePlay);

    // 实时更新歌词
    audio.addEventListener('timeupdate', () => {
      const currentTime = Math.floor(audio.currentTime);
      const song = songList[currentIndex];
      
      if (typeof lyricsDatabase !== 'undefined' && lyricsDatabase[song.lyricId]) {
        const lyrics = lyricsDatabase[song.lyricId];
        // 查找当前时间对应的歌词
        let currentText = "…";
        for (let i = 0; i < lyrics.length; i++) {
          if (currentTime >= lyrics[i].time) {
            currentText = lyrics[i].text;
          } else {
            break;
          }
        }
        lyricDisplay.innerText = currentText;
      } else {
        lyricDisplay.innerText = "暂无歌词数据";
      }
    });

    // 渲染播放列表菜单
    function renderPlaylist() {
      playlistPanel.innerHTML = '';
      songList.forEach((song, i) => {
        const item = document.createElement('div');
        item.className = `playlist-item ${i === currentIndex ? 'playing' : ''}`;
        item.innerHTML = `<span>${song.title}</span><span style="font-size:12px;opacity:0.6">${song.artist}</span>`;
        
        item.addEventListener('click', (e) => {
          e.stopPropagation();
          currentIndex = i;
          loadSong(currentIndex);
          playSong();
          playlistPanel.classList.remove('active');
        });
        
        playlistPanel.appendChild(item);
      });
    }

    // 更新播放列表中正在播放的高亮项
    function updatePlaylistHighlight() {
      const items = playlistPanel.querySelectorAll('.playlist-item');
      items.forEach((item, index) => {
        if (index === currentIndex) {
          item.classList.add('playing');
        } else {
          item.classList.remove('playing');
        }
      });
    }

    // 点击按钮展开/收起播放列表
    playlistToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      playlistPanel.classList.toggle('active');
    });

    // 点击页面任意空白区域，自动收起播放列表面板
    document.addEventListener('click', () => {
      playlistPanel.classList.remove('active');
    });
  </script>
</body>
</html>
