<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歌单与单行歌词跟随黑胶播放器</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 最外层容器：四周留出充分的 padding 空间，给外阴影自然渐变过度 */
    .player-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      container-type: inline-size;
      padding: 6cqw 8cqw 6cqw 6cqw;
    }

    /* 最外层大底座卡片 */
    .outer-card {
      width: 100%;
      padding: 3.5cqw;
      background: #f3f6fa;
      border-radius: 5cqw;
      box-shadow: 
        1.5cqw 2cqw 3.5cqw rgba(166, 180, 200, 0.4),
        3cqw 4cqw 7cqw rgba(166, 180, 200, 0.25),
        -1.5cqw -1.5cqw 3.5cqw rgba(255, 255, 255, 0.95);
      position: relative;
    }

    /* 内层主要播放器卡片 */
    .player-card {
      background: #f5f8fc;
      border-radius: 4cqw;
      padding: 4.5cqw;
      box-shadow: 
        inset 0.8cqw 0.8cqw 1.8cqw rgba(166, 180, 200, 0.2),
        inset -0.8cqw -0.8cqw 1.8cqw rgba(255, 255, 255, 0.85),
        1cqw 2cqw 4cqw rgba(166, 180, 200, 0.25);
      display: flex;
      align-items: center;
      gap: 4.5cqw;
      position: relative;
    }

    /* 左侧唱片外框 */
    .vinyl-wrapper {
      width: 28cqw;
      height: 28cqw;
      border-radius: 50%;
      background: #f3f6fa;
      padding: 1cqw;
      box-shadow: 
        1cqw 1.5cqw 3cqw rgba(166, 180, 200, 0.35),
        -1cqw -1cqw 3cqw rgba(255, 255, 255, 0.9),
        inset 0.4cqw 0.4cqw 0.8cqw rgba(166, 180, 200, 0.15);
      flex-shrink: 0;
      position: relative;
    }

    /* 唱片盘主体 */
    .vinyl-disk {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: 
        radial-gradient(circle, transparent 20%, rgba(255,255,255,0.6) 21%, transparent 22%),
        radial-gradient(circle, transparent 38%, rgba(255,255,255,0.4) 39%, transparent 40%),
        radial-gradient(circle, transparent 55%, rgba(255,255,255,0.3) 56%, transparent 57%),
        radial-gradient(circle, #7db3f0 0%, #a2cbf8 45%, #cae3fc 75%, #a8d0f8 100%);
      box-shadow: 0 1cqw 2.5cqw rgba(120, 160, 210, 0.25);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      transition: transform 0.4s ease;
    }

    .playing .vinyl-disk {
      animation: rotateVinyl 18s linear infinite;
    }

    @keyframes rotateVinyl {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* 唱片中心金属圆环 */
    .vinyl-center-outer {
      width: 9cqw;
      height: 9cqw;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      border: 0.4cqw solid #82b4ed;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 0.2cqw 0.8cqw rgba(0,0,0,0.08);
    }

    .vinyl-center-dot {
      width: 1.8cqw;
      height: 1.8cqw;
      background: #4881c2;
      border-radius: 50%;
    }

    /* 右侧控制与信息区域 */
    .right-content {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 0;
    }

    /* 歌名与单行歌词区域 */
    .song-title {
      font-size: 2.8cqw;
      color: #8da4c4;
      letter-spacing: 0.15cqw;
      font-weight: 600;
      margin-bottom: 0.5cqw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      text-align: center;
    }

    /* 单行跟随歌词 */
    .lyric-line {
      font-size: 2cqw;
      color: #a0b2c6;
      letter-spacing: 0.1cqw;
      margin-bottom: 1.8cqw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      text-align: center;
      transition: opacity 0.3s ease, transform 0.3s ease;
      height: 2.6cqw;
      line-height: 2.6cqw;
    }

    .lyric-line.changing {
      opacity: 0;
      transform: translateY(2px);
    }

    /* 波形线 SVG 容器 */
    .waveform-box {
      width: 100%;
      height: 7cqw;
      margin-bottom: 2cqw;
      position: relative;
    }

    .waveform-box svg {
      width: 100%;
      height: 100%;
    }

    /* 播放控制按钮栏 */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3.5cqw;
      margin-bottom: 2.5cqw;
    }

    .btn-icon {
      background: none;
      border: none;
      cursor: pointer;
      color: #a8b8cc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .btn-icon svg {
      width: 3.2cqw;
      height: 3.2cqw;
    }

    .btn-icon:active {
      transform: scale(0.9);
    }

    /* 主播放/暂停按钮 */
    .btn-main {
      width: 7.5cqw;
      height: 7.5cqw;
      border-radius: 50%;
      background: #f5f8fc;
      box-shadow: 
        0.8cqw 1cqw 2cqw rgba(166, 180, 200, 0.35),
        -0.8cqw -0.8cqw 2cqw rgba(255, 255, 255, 0.9);
    }

    /* 进度条样式 */
    .progress-section {
      width: 100%;
    }

    .progress-bar-bg {
      width: 100%;
      height: 1cqw;
      background: #e2eaf3;
      border-radius: 0.5cqw;
      box-shadow: inset 0.2cqw 0.2cqw 0.5cqw rgba(166, 180, 200, 0.3);
      position: relative;
      cursor: pointer;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #7db0e8;
      border-radius: 0.5cqw;
      position: relative;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      right: -1cqw;
      top: -0.8cqw;
      width: 2.6cqw;
      height: 2.6cqw;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0.3cqw 0.4cqw 1cqw rgba(120, 150, 190, 0.35);
    }

    /* 时间文本 */
    .time-labels {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 2.2cqw;
      color: #bdcbdb;
      margin-top: 1.2cqw;
      font-weight: 400;
    }

    /* 底部开关键装饰 */
    .bottom-indicator {
      margin-top: 2.2cqw;
      display: flex;
      align-items: center;
      gap: 1.5cqw;
      padding-left: 1.5cqw;
    }

    .small-dot {
      width: 2cqw;
      height: 2cqw;
      border-radius: 50%;
      background: #f3f6fa;
      box-shadow: 
        inset 0.3cqw 0.3cqw 0.5cqw rgba(166, 180, 200, 0.3),
        inset -0.3cqw -0.3cqw 0.5cqw rgba(255, 255, 255, 0.8);
    }

    .small-bar {
      width: 7.5cqw;
      height: 0.8cqw;
      background: #e2eaf3;
      border-radius: 0.5cqw;
      box-shadow: inset 0.2cqw 0.2cqw 0.5cqw rgba(166, 180, 200, 0.25);
    }
  </style>
</head>
<body>

  <div class="player-container">
    <div class="outer-card">
      <div class="player-card" id="playerCard">
        
        <div class="vinyl-wrapper">
          <div class="vinyl-disk">
            <div class="vinyl-center-outer">
              <div class="vinyl-center-dot"></div>
            </div>
          </div>
        </div>

        <div class="right-content">
          <!-- 歌名 -->
          <div class="song-title" id="songTitle">wave of w music</div>
          <!-- 动态单行跟随歌词 -->
          <div class="lyric-line" id="lyricLine">~ 正在加载歌词 ~</div>

          <div class="waveform-box">
            <svg viewBox="0 0 200 40" preserveAspectRatio="none">
              <path id="wavePathBg" d="" fill="none" stroke="#d5e1ef" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path id="wavePath" d="" fill="none" stroke="#7eb2e9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>

          <div class="controls-row">
            <button class="btn-icon" id="prevBtn" aria-label="上一首">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/>
              </svg>
            </button>

            <button class="btn-icon btn-main" id="playBtn" aria-label="播放/暂停">
              <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
              </svg>
            </button>

            <button class="btn-icon" id="nextBtn" aria-label="下一首">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/>
              </svg>
            </button>
          </div>

          <div class="progress-section">
            <div class="progress-bar-bg" id="progressBg">
              <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="time-labels">
              <span id="currentTime">00:00</span>
              <span id="duration">04:17</span>
            </div>
          </div>

        </div>
      </div>

      <div class="bottom-indicator">
        <div class="small-dot"></div>
        <div class="small-bar"></div>
      </div>
    </div>
  </div>

  <script>
    // ===== 歌单与歌词数据配置 =====
    const playlist = [
      {
        title: "Wave of W Music",
        artist: "Music Trainer",
        duration: 257, // 04:17
        lyrics: [
          { time: 0, text: "♪ (纯音乐轻柔前奏)" },
          { time: 12, text: "微风吹过海浪的记忆" },
          { time: 25, text: "旋律在夜色中缓缓升起" },
          { time: 42, text: "每一次跳动的音符 都是对你的思念" },
          { time: 65, text: "就像海浪拍打着海岸 永不停息" },
          { time: 90, text: "Wave of w music, 唱出心中的温柔" },
          { time: 120, text: "让时光停留在这一刻" },
          { time: 155, text: "跟随着旋律 漫步在星空之下" },
          { time: 190, text: "无论风雨 音乐始终陪伴在你身边" },
          { time: 230, text: "♪ (渐弱尾奏)" }
        ]
      },
      {
        title: "晴天 (Cover)",
        artist: "Jay Chou",
        duration: 269, // 04:29
        lyrics: [
          { time: 0, text: "故事的小黄花 从出生那年就飘着" },
          { time: 15, text: "童年的荡秋千 随记忆一直晃到现在" },
          { time: 32, text: "Re So So Si Do Si La So La Si Si Si Si La Si La So" },
          { time: 50, text: "吹着前奏望着天空 我想起花瓣试着掉落" },
          { time: 75, text: "为你烘托 刮风这天我试过握着你手" },
          { time: 105, text: "但偏偏 雨渐渐 大到我看你不见" },
          { time: 140, text: "还要多久 我才能在你身边" },
          { time: 180, text: "等到放晴的那天 也许我会比较好一点" }
        ]
      }
    ];

    let currentTrackIndex = 0;
    let isPlaying = true;
    let phase = 0;
    let currentProgress = 0; // 0 ~ 1
    let lastLyricText = "";

    // DOM 元素
    const playerCard = document.getElementById('playerCard');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const songTitleEl = document.getElementById('songTitle');
    const lyricLineEl = document.getElementById('lyricLine');
    const wavePath = document.getElementById('wavePath');
    const wavePathBg = document.getElementById('wavePathBg');
    const progressFill = document.getElementById('progressFill');
    const progressBg = document.getElementById('progressBg');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');

    // 格式化时间
    function formatTime(secs) {
      const mins = Math.floor(secs / 60).toString().padStart(2, '0');
      const s = Math.floor(secs % 60).toString().padStart(2, '0');
      return `${mins}:${s}`;
    }

    // 加载当前歌曲信息
    function loadTrack(index) {
      currentTrackIndex = index;
      const track = playlist[currentTrackIndex];
      songTitleEl.innerText = track.title;
      durationEl.innerText = formatTime(track.duration);
      currentProgress = 0;
      lastLyricText = "";
      updateLyrics(0);
    }

    // 动态跟随更新歌词
    function updateLyrics(currentSecs) {
      const track = playlist[currentTrackIndex];
      let activeLyric = track.lyrics[0].text;

      for (let i = 0; i < track.lyrics.length; i++) {
        if (currentSecs >= track.lyrics[i].time) {
          activeLyric = track.lyrics[i].text;
        } else {
          break;
        }
      }

      if (activeLyric !== lastLyricText) {
        lastLyricText = activeLyric;
        lyricLineEl.classList.add('changing');
        setTimeout(() => {
          lyricLineEl.innerText = activeLyric;
          lyricLineEl.classList.remove('changing');
        }, 150);
      }
    }

    // 波形生成算法
    const baseAmplitudes = [
      0, 0, 5, -8, 4, -4, 12, -12, 6, -6, 2, -2, 15, -15, 10, -10,
      5, -5, 18, -18, 8, -8, 4, -4, 12, -12, 6, -6, 2, -2, 10, -10,
      2, -2, 5, -5, 0, 0
    ];

    function generateWavePath(timeOffset) {
      const pointsCount = baseAmplitudes.length;
      const width = 200;
      const step = width / (pointsCount - 1);
      const centerY = 20;

      let d = `M 0 ${centerY} `;
      for (let i = 1; i < pointsCount - 1; i++) {
        const x = i * step;
        const dynamicFactor = isPlaying ? Math.sin(timeOffset * 0.08 + i * 0.4) * 0.4 + 0.8 : 0.6;
        const y = centerY + baseAmplitudes[i] * dynamicFactor;
        d += `L ${x.toFixed(1)} ${y.toFixed(1)} `;
      }
      d += `L ${width} ${centerY}`;
      return d;
    }

    // 主渲染与更新循环
    function updateFrame() {
      const currentTrack = playlist[currentTrackIndex];

      if (isPlaying) {
        phase += 1;
        currentProgress += 0.0003;
        if (currentProgress > 1) currentProgress = 0;

        progressFill.style.width = `${(currentProgress * 100).toFixed(1)}%`;
        const currSecs = currentProgress * currentTrack.duration;
        currentTimeEl.innerText = formatTime(currSecs);

        // 实时跟随歌词
        updateLyrics(currSecs);
      }

      const pathData = generateWavePath(phase);
      wavePath.setAttribute('d', pathData);
      wavePathBg.setAttribute('d', pathData);

      requestAnimationFrame(updateFrame);
    }

    // 事件绑定：播放/暂停
    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      if (isPlaying) {
        playerCard.classList.add('playing');
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      } else {
        playerCard.classList.remove('playing');
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      }
    });

    // 事件绑定：上一首 / 下一首
    prevBtn.addEventListener('click', () => {
      let newIndex = currentTrackIndex - 1;
      if (newIndex < 0) newIndex = playlist.length - 1;
      loadTrack(newIndex);
    });

    nextBtn.addEventListener('click', () => {
      let newIndex = (currentTrackIndex + 1) % playlist.length;
      loadTrack(newIndex);
    });

    // 事件绑定：点击进度条跳转
    progressBg.addEventListener('click', (e) => {
      const rect = progressBg.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      currentProgress = Math.max(0, Math.min(1, clickX / rect.width));
      progressFill.style.width = `${(currentProgress * 100).toFixed(1)}%`;
      
      const currentTrack = playlist[currentTrackIndex];
      const currSecs = currentProgress * currentTrack.duration;
      currentTimeEl.innerText = formatTime(currSecs);
      updateLyrics(currSecs);
    });

    // 初始化
    loadTrack(0);
    playerCard.classList.add('playing');
    updateFrame();
  </script>
</body>
</html>
