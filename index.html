<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歌单与单行歌词跟随黑胶播放器</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 最外层容器 */
    .player-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      container-type: inline-size;
      padding: 6cqw 8cqw 6cqw 6cqw;
    }

    /* 最外层大底座卡片 */
    .outer-card {
      width: 100%;
      padding: 3.5cqw;
      background: #f3f6fa;
      border-radius: 5cqw;
      box-shadow: 
        1.5cqw 2cqw 3.5cqw rgba(166, 180, 200, 0.4),
        3cqw 4cqw 7cqw rgba(166, 180, 200, 0.25),
        -1.5cqw -1.5cqw 3.5cqw rgba(255, 255, 255, 0.95);
      position: relative;
    }

    /* 内层主要播放器卡片 */
    .player-card {
      background: #f5f8fc;
      border-radius: 4cqw;
      padding: 4.5cqw;
      box-shadow: 
        inset 0.8cqw 0.8cqw 1.8cqw rgba(166, 180, 200, 0.2),
        inset -0.8cqw -0.8cqw 1.8cqw rgba(255, 255, 255, 0.85),
        1cqw 2cqw 4cqw rgba(166, 180, 200, 0.25);
      display: flex;
      align-items: center;
      gap: 4.5cqw;
      position: relative;
    }

    /* 左侧唱片外框 */
    .vinyl-wrapper {
      width: 28cqw;
      height: 28cqw;
      border-radius: 50%;
      background: #f3f6fa;
      padding: 1cqw;
      box-shadow: 
        1cqw 1.5cqw 3cqw rgba(166, 180, 200, 0.35),
        -1cqw -1cqw 3cqw rgba(255, 255, 255, 0.9),
        inset 0.4cqw 0.4cqw 0.8cqw rgba(166, 180, 200, 0.15);
      flex-shrink: 0;
      position: relative;
    }

    /* 唱片盘主体 */
    .vinyl-disk {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: 
        radial-gradient(circle, transparent 20%, rgba(255,255,255,0.6) 21%, transparent 22%),
        radial-gradient(circle, transparent 38%, rgba(255,255,255,0.4) 39%, transparent 40%),
        radial-gradient(circle, transparent 55%, rgba(255,255,255,0.3) 56%, transparent 57%),
        radial-gradient(circle, #7db3f0 0%, #a2cbf8 45%, #cae3fc 75%, #a8d0f8 100%);
      box-shadow: 0 1cqw 2.5cqw rgba(120, 160, 210, 0.25);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      transition: transform 0.4s ease;
    }

    .playing .vinyl-disk {
      animation: rotateVinyl 18s linear infinite;
    }

    @keyframes rotateVinyl {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* 唱片中心金属圆环 */
    .vinyl-center-outer {
      width: 9cqw;
      height: 9cqw;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      border: 0.4cqw solid #82b4ed;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 0.2cqw 0.8cqw rgba(0,0,0,0.08);
    }

    .vinyl-center-dot {
      width: 1.8cqw;
      height: 1.8cqw;
      background: #4881c2;
      border-radius: 50%;
    }

    /* 右侧控制与信息区域 */
    .right-content {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 0;
      position: relative;
    }

    /* 歌名 */
    .song-title {
      font-size: 2.8cqw;
      color: #8da4c4;
      letter-spacing: 0.15cqw;
      font-weight: 600;
      margin-bottom: 0.5cqw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      text-align: center;
    }

    /* 单行跟随歌词 */
    .lyric-line {
      font-size: 2cqw;
      color: #a0b2c6;
      letter-spacing: 0.1cqw;
      margin-bottom: 1.8cqw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      text-align: center;
      transition: opacity 0.3s ease, transform 0.3s ease;
      height: 2.6cqw;
      line-height: 2.6cqw;
    }

    .lyric-line.changing {
      opacity: 0;
      transform: translateY(2px);
    }

    /* 波形线 SVG 容器 */
    .waveform-box {
      width: 100%;
      height: 7cqw;
      margin-bottom: 2cqw;
      position: relative;
    }

    .waveform-box svg {
      width: 100%;
      height: 100%;
    }

    /* 播放控制按钮栏 */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3.5cqw;
      margin-bottom: 2.5cqw;
      width: 100%;
      position: relative;
    }

    .btn-icon {
      background: none;
      border: none;
      cursor: pointer;
      color: #a8b8cc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: color 0.2s ease, transform 0.1s ease;
    }

    .btn-icon svg {
      width: 3.2cqw;
      height: 3.2cqw;
    }

    .btn-icon:active {
      transform: scale(0.9);
    }

    /* 右侧播放列表按钮 */
    .playlist-toggle-btn {
      position: absolute;
      right: 0.5cqw;
      color: #b8c8dc;
    }

    .playlist-toggle-btn svg {
      width: 2.8cqw;
      height: 2.8cqw;
    }

    .playlist-toggle-btn:hover {
      color: #7db0e8;
    }

    /* 弹出式播放列表抽屉 */
    .playlist-panel {
      position: absolute;
      bottom: 12cqw;
      right: 0;
      width: 26cqw;
      max-height: 22cqw;
      background: rgba(245, 248, 252, 0.96);
      backdrop-filter: blur(10px);
      border-radius: 2.5cqw;
      box-shadow: 
        0.8cqw 1cqw 3cqw rgba(166, 180, 200, 0.35),
        -0.5cqw -0.5cqw 1.5cqw rgba(255, 255, 255, 0.9);
      overflow-y: auto;
      display: none;
      z-index: 100;
      padding: 1cqw 0;
      border: 0.2cqw solid #e2eaf3;
    }

    .playlist-panel.active {
      display: block;
    }

    .playlist-item {
      padding: 1.2cqw 2cqw;
      font-size: 1.8cqw;
      color: #7a8fa8;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .playlist-item:hover {
      background: #e9f0f8;
      color: #4881c2;
    }

    .playlist-item.playing {
      color: #4881c2;
      font-weight: 600;
      background: #e2eefb;
    }

    /* 主播放/暂停按钮 */
    .btn-main {
      width: 7.5cqw;
      height: 7.5cqw;
      border-radius: 50%;
      background: #f5f8fc;
      box-shadow: 
        0.8cqw 1cqw 2cqw rgba(166, 180, 200, 0.35),
        -0.8cqw -0.8cqw 2cqw rgba(255, 255, 255, 0.9);
    }

    /* 进度条样式 */
    .progress-section {
      width: 100%;
    }

    .progress-bar-bg {
      width: 100%;
      height: 1cqw;
      background: #e2eaf3;
      border-radius: 0.5cqw;
      box-shadow: inset 0.2cqw 0.2cqw 0.5cqw rgba(166, 180, 200, 0.3);
      position: relative;
      cursor: pointer;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #7db0e8;
      border-radius: 0.5cqw;
      position: relative;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      right: -1cqw;
      top: -0.8cqw;
      width: 2.6cqw;
      height: 2.6cqw;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0.3cqw 0.4cqw 1cqw rgba(120, 150, 190, 0.35);
    }

    /* 时间文本 */
    .time-labels {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 2.2cqw;
      color: #bdcbdb;
      margin-top: 1.2cqw;
      font-weight: 400;
    }

    /* 底部装饰 */
    .bottom-indicator {
      margin-top: 2.2cqw;
      display: flex;
      align-items: center;
      gap: 1.5cqw;
      padding-left: 1.5cqw;
    }

    .small-dot {
      width: 2cqw;
      height: 2cqw;
      border-radius: 50%;
      background: #f3f6fa;
      box-shadow: 
        inset 0.3cqw 0.3cqw 0.5cqw rgba(166, 180, 200, 0.3),
        inset -0.3cqw -0.3cqw 0.5cqw rgba(255, 255, 255, 0.8);
    }

    .small-bar {
      width: 7.5cqw;
      height: 0.8cqw;
      background: #e2eaf3;
      border-radius: 0.5cqw;
      box-shadow: inset 0.2cqw 0.2cqw 0.5cqw rgba(166, 180, 200, 0.25);
    }
  </style>
</head>
<body>

  <div class="player-container">
    <div class="outer-card">
      <div class="player-card" id="playerCard">
        
        <div class="vinyl-wrapper">
          <div class="vinyl-disk">
            <div class="vinyl-center-outer">
              <div class="vinyl-center-dot"></div>
            </div>
          </div>
        </div>

        <div class="right-content">
          <div class="song-title" id="songTitle">加载中...</div>
          <div class="lyric-line" id="lyricLine">~ 正在加载歌词 ~</div>

          <div class="waveform-box">
            <svg viewBox="0 0 200 40" preserveAspectRatio="none">
              <path id="wavePathBg" d="" fill="none" stroke="#d5e1ef" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path id="wavePath" d="" fill="none" stroke="#7eb2e9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>

          <div class="controls-row">
            <button class="btn-icon" id="prevBtn" aria-label="上一首">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/>
              </svg>
            </button>

            <button class="btn-icon btn-main" id="playBtn" aria-label="播放/暂停">
              <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
              </svg>
            </button>

            <button class="btn-icon" id="nextBtn" aria-label="下一首">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/>
              </svg>
            </button>

            <button class="btn-icon playlist-toggle-btn" id="playlistToggleBtn" aria-label="播放列表" title="播放列表">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/>
              </svg>
            </button>

            <div class="playlist-panel" id="playlistPanel"></div>
          </div>

          <div class="progress-section">
            <div class="progress-bar-bg" id="progressBg">
              <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="time-labels">
              <span id="currentTime">00:00</span>
              <span id="duration">00:00</span>
            </div>
          </div>

        </div>
      </div>

      <div class="bottom-indicator">
        <div class="small-dot"></div>
        <div class="small-bar"></div>
      </div>
    </div>
  </div>

  <!-- 引入外部文件：修正了带 s 的文件名 -->
  <script src="lyrics.js"></script>
  <script src="songs.js"></script>
  <script>
    let currentTrackIndex = 0;
    let isPlaying = true;
    let phase = 0;
    let currentProgress = 0;
    let lastLyricText = "";

    // DOM 元素
    const playerCard = document.getElementById('playerCard');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const songTitleEl = document.getElementById('songTitle');
    const lyricLineEl = document.getElementById('lyricLine');
    const wavePath = document.getElementById('wavePath');
    const wavePathBg = document.getElementById('wavePathBg');
    const progressFill = document.getElementById('progressFill');
    const progressBg = document.getElementById('progressBg');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const playlistToggleBtn = document.getElementById('playlistToggleBtn');
    const playlistPanel = document.getElementById('playlistPanel');

    // 时间格式化
    function formatTime(secs) {
      const mins = Math.floor(secs / 60).toString().padStart(2, '0');
      const s = Math.floor(secs % 60).toString().padStart(2, '0');
      return `${mins}:${s}`;
    }

    // 切歌与加载歌曲信息
    function loadTrack(index) {
      if (!playlist || playlist.length === 0) return;
      currentTrackIndex = index;
      const track = playlist[currentTrackIndex];
      songTitleEl.innerText = `${track.title} - ${track.artist}`;
      durationEl.innerText = formatTime(track.duration);
      currentProgress = 0;
      lastLyricText = "";
      updateLyrics(0);
      updatePlaylistHighlight();
    }

    // 动态更新单行跟随歌词
    function updateLyrics(currentSecs) {
      const track = playlist[currentTrackIndex];
      if (!track) return;

      const currentLyrics = lyricsDatabase ? lyricsDatabase[track.lyricId] : null;

      if (!currentLyrics || currentLyrics.length === 0) {
        lyricLineEl.innerText = "暂无歌词";
        return;
      }

      let activeLyric = currentLyrics[0].text;
      for (let i = 0; i < currentLyrics.length; i++) {
        if (currentSecs >= currentLyrics[i].time) {
          activeLyric = currentLyrics[i].text;
        } else {
          break;
        }
      }

      if (activeLyric !== lastLyricText) {
        lastLyricText = activeLyric;
        lyricLineEl.classList.add('changing');
        setTimeout(() => {
          lyricLineEl.innerText = activeLyric;
          lyricLineEl.classList.remove('changing');
        }, 150);
      }
    }

    // 波形线生成
    const baseAmplitudes = [
      0, 0, 5, -8, 4, -4, 12, -12, 6, -6, 2, -2, 15, -15, 10, -10,
      5, -5, 18, -18, 8, -8, 4, -4, 12, -12, 6, -6, 2, -2, 10, -10,
      2, -2, 5, -5, 0, 0
    ];

    function generateWavePath(timeOffset) {
      const pointsCount = baseAmplitudes.length;
      const width = 200;
      const step = width / (pointsCount - 1);
      const centerY = 20;

      let d = `M 0 ${centerY} `;
      for (let i = 1; i < pointsCount - 1; i++) {
        const x = i * step;
        const dynamicFactor = isPlaying ? Math.sin(timeOffset * 0.08 + i * 0.4) * 0.4 + 0.8 : 0.6;
        const y = centerY + baseAmplitudes[i] * dynamicFactor;
        d += `L ${x.toFixed(1)} ${y.toFixed(1)} `;
      }
      d += `L ${width} ${centerY}`;
      return d;
    }

    // 主渲染帧循环
    function updateFrame() {
      if (playlist && playlist.length > 0) {
        const currentTrack = playlist[currentTrackIndex];

        if (isPlaying) {
          phase += 1;
          currentProgress += 0.0003;
          if (currentProgress > 1) currentProgress = 0;

          progressFill.style.width = `${(currentProgress * 100).toFixed(1)}%`;
          const currSecs = currentProgress * currentTrack.duration;
          currentTimeEl.innerText = formatTime(currSecs);

          updateLyrics(currSecs);
        }
      }

      const pathData = generateWavePath(phase);
      wavePath.setAttribute('d', pathData);
      wavePathBg.setAttribute('d', pathData);

      requestAnimationFrame(updateFrame);
    }

    // 渲染播放列表菜单
    function renderPlaylist() {
      playlistPanel.innerHTML = '';
      if (!playlist) return;
      playlist.forEach((track, i) => {
        const item = document.createElement('div');
        item.className = `playlist-item ${i === currentTrackIndex ? 'playing' : ''}`;
        item.innerHTML = `<span>${track.title}</span><span style="font-size:1.4cqw;opacity:0.7">${track.artist}</span>`;
        
        item.addEventListener('click', (e) => {
          e.stopPropagation();
          loadTrack(i);
          playlistPanel.classList.remove('active');
        });
        
        playlistPanel.appendChild(item);
      });
    }

    // 更新列表中当前高亮项目
    function updatePlaylistHighlight() {
      const items = playlistPanel.querySelectorAll('.playlist-item');
      items.forEach((item, index) => {
        if (index === currentTrackIndex) {
          item.classList.add('playing');
        } else {
          item.classList.remove('playing');
        }
      });
    }

    // 交互事件
    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      if (isPlaying) {
        playerCard.classList.add('playing');
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      } else {
        playerCard.classList.remove('playing');
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      }
    });

    prevBtn.addEventListener('click', () => {
      let newIndex = currentTrackIndex - 1;
      if (newIndex < 0) newIndex = playlist.length - 1;
      loadTrack(newIndex);
    });

    nextBtn.addEventListener('click', () => {
      let newIndex = (currentTrackIndex + 1) % playlist.length;
      loadTrack(newIndex);
    });

    progressBg.addEventListener('click', (e) => {
      const rect = progressBg.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      currentProgress = Math.max(0, Math.min(1, clickX / rect.width));
      progressFill.style.width = `${(currentProgress * 100).toFixed(1)}%`;
      
      const currentTrack = playlist[currentTrackIndex];
      const currSecs = currentProgress * currentTrack.duration;
      currentTimeEl.innerText = formatTime(currSecs);
      updateLyrics(currSecs);
    });

    playlistToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      playlistPanel.classList.toggle('active');
    });

    document.addEventListener('click', () => {
      playlistPanel.classList.remove('active');
    });

    // 初始化运行
    renderPlaylist();
    loadTrack(0);
    playerCard.classList.add('playing');
    updateFrame();
  </script>
</body>
</html>
